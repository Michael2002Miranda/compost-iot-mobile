name: compost_iot_mobile
description: "Aplicación móvil con IoT para monitorear el proceso de compostaje en El Porvenir (UPAO 2026)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  # Se fija la implementación de Android en 2.4.0: la 2.5.x incorpora `jni`
  # (código nativo con CMake), que exige NDK y hace fallar la compilación en
  # equipos sin ese componente. Esta versión cubre lo que usa la aplicación.
  shared_preferences: ^2.3.0

dependency_overrides:
  shared_preferences_android: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
